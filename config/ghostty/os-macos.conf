# =============================================================================
# Ghostty config — macOS-specific overrides
# =============================================================================
# Symlinked to ~/.config/ghostty/os.conf by install.sh on macOS.
# Anything macOS-only goes here so the common config stays portable.
# =============================================================================

# Let Option+key send Alt (some nvim/tmux bindings expect this).
macos-option-as-alt = true
