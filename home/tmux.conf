# =============================================================================
# ~/.tmux.conf — tmux configuration
# =============================================================================
# Reload after edits with:  tmux source-file ~/.tmux.conf
# (or run :source-file ~/.tmux.conf from inside a tmux session)
# =============================================================================



# ---- Prefix key --------------------------------------------------------------
# tmux's "leader" — every tmux command starts with this key combo.
# Default is C-b; rebind to C-a (easier to reach, doesn't clash with vim's C-b page-up).
unbind C-b
set -g prefix C-a
bind C-a send-prefix    # press C-a twice to send a literal C-a to the inner program



# ---- Mouse + colors ----------------------------------------------------------
set -g mouse on                                   # click panes, drag-resize splits, scroll with mouse wheel

# Use tmux-256color (modern, supports italics + extended SGR) instead of
# screen-256color, which is older and mishandles some escape sequences —
# causing background-color residue / cursor-block artifacts in apps that
# stream output (Claude Code, certain TUIs).
set -g default-terminal "tmux-256color"

# Truecolor (24-bit RGB) passthrough. terminal-features is the modern
# (tmux 3.2+) way to say "this outer terminal supports RGB" — cleaner than
# the old terminal-overrides Tc hack. List every TERM the outer terminal
# might advertise; the wildcard catches Ghostty + iTerm + WezTerm.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",*-256color:RGB"



# ---- Index from 1, not 0 -----------------------------------------------------
# Windows and panes start at 1; <prefix>1 jumps to first window (keyboard-friendlier).
set -g base-index 1
setw -g pane-base-index 1



# ---- Vim-style pane navigation -----------------------------------------------
# <prefix> h / j / k / l to move between panes (instead of arrow keys).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Larger pane-resize steps with H / J / K / L (capitalized).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5



# ---- Quality of life ---------------------------------------------------------
set -g history-limit 10000      # scrollback buffer per pane
set -s escape-time 0            # remove the tiny delay after pressing Escape (helps vim)
setw -g mode-keys vi            # use vim keys in copy mode (<prefix> [, then hjkl, v, y)
set -g focus-events on          # let inner programs (nvim) know when their pane gains focus



# ---- Mouse wheel: scroll 1 line per notch ------------------------------------
# Default copy-mode wheel scrolls 5 lines per notch; override to 1 line for finer reading.
bind -T copy-mode-vi WheelUpPane   send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
bind -T copy-mode    WheelUpPane   send -X scroll-up
bind -T copy-mode    WheelDownPane send -X scroll-down



# ---- Ctrl + wheel: amplified scroll (5 lines per notch) ----------------------
# Hold Ctrl while scrolling to move faster through scrollback.
# (Plain wheel = 1 line for fine reading; Ctrl+wheel = 5 lines for jumping.)
bind -T copy-mode-vi C-WheelUpPane   send -X -N 5 scroll-up
bind -T copy-mode-vi C-WheelDownPane send -X -N 5 scroll-down
bind -T copy-mode    C-WheelUpPane   send -X -N 5 scroll-up
bind -T copy-mode    C-WheelDownPane send -X -N 5 scroll-down

# From a normal pane (not yet in copy mode): Ctrl+WheelUp enters copy mode +
# immediately scrolls 5 lines. Skip when an alternate-screen app (vim, less)
# is running — those want the raw mouse event.
bind -T root C-WheelUpPane \
    if-shell -F "#{?alternate_on,1,0}" \
        "send-keys -M" \
        "copy-mode -e ; send-keys -X -N 5 scroll-up"



# ---- Status bar --------------------------------------------------------------
set -g status-style 'bg=default fg=#a9b1d6'                              # bg=default lets the Ghostty wallpaper show through
set -g status-left  '#[fg=#7aa2f7,bold] #S '                              # session name on left
set -g status-right '#[fg=#7aa2f7] %H:%M '                                # clock on right
setw -g window-status-current-style 'fg=#7aa2f7,bold'                    # active window: bold + accent color (no bg, so wallpaper shows)



# ---- Plugins (TPM) -----------------------------------------------------------
# Managed by tpm (github.com/tmux-plugins/tpm), cloned at ~/.tmux/plugins/tpm.
# <prefix> I installs newly listed plugins; <prefix> U updates installed ones.
set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect: saves sessions/windows/panes (layout, working dirs, running
# programs) to ~/.tmux/resurrect so they survive a reboot or crash.
# Manual save: <prefix> Ctrl-s    Manual restore: <prefix> Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-continuum: drives resurrect automatically. Saves every 15 minutes and
# restores the last save when the tmux server starts, so a crash or kernel
# panic costs at most 15 minutes of session state.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize tpm (keep this line at the very bottom of the file).
run '~/.tmux/plugins/tpm/tpm'
